<title>Lộ trình TOEIC Online 500+ · Ms. Ngọc Huyền</title>
<style>
:root{--bg:#FFF7FA;--card:#fff;--ink:#36141F;--muted:#85596B;--line:#F1CEDB;--accent:#C41F63;--deep:#8E1446;--bad:#B4232C}
@media (prefers-color-scheme:dark){:root{--bg:#1A0F14;--card:#24151C;--ink:#F8E8EF;--muted:#C7A1B2;--line:#45283A;--accent:#FF77A9;--deep:#FFB3CF;--bad:#FF8A8A}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15.5px/1.55 "DM Sans","Segoe UI",system-ui,sans-serif;padding:18px}
.box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:0 8px 30px rgba(120,20,60,.10)}
.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--deep),var(--accent));color:#fff;display:grid;place-items:center;font:700 14px Georgia,serif}
h1{font:700 1.45rem Georgia,"Times New Roman",serif;margin:14px 0 4px}p{margin:0 0 14px;color:var(--muted);font-size:.93rem}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:11px;background:#fff;color:#36141F;cursor:pointer}
.gbtn:disabled{opacity:.6}.gbtn svg{width:20px;height:20px}
.pbtn{width:100%;font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px;background:var(--accent);color:#fff;cursor:pointer;margin-top:10px;text-decoration:none;display:block;text-align:center}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin:10px 0 0}
.who{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.9rem;margin-bottom:12px;word-break:break-all}
.alt{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:.88rem}.alt a{color:var(--accent)}
.wait{text-align:center;color:var(--muted)}
</style></head><body>

  box().innerHTML=`<div class="mark">500+</div><h1>Chưa mở được tài liệu</h1>
  <div class="who">Em đang đăng nhập: <b>${esc(email)}</b></div>
  <p>${reason}</p><p>Nhắn Zalo cho cô (<b>${ZALO}</b>) kèm Gmail ở trên để được kích hoạt. Nếu em đăng ký bằng Gmail khác, bấm nút dưới để đổi tài khoản.</p>
  <button class="gbtn" id="sw">${G_ICON}<span>Đăng nhập bằng Gmail khác</span></button>
  <div class="alt"><a href="gioi-thieu.html">Xem khoá học</a><a href="https://zalo.me/0779693605" target="_blank" rel="noopener">Zalo cô Huyền</a></div>`;
  document.getElementById("sw").onclick=async()=>{ await fb.signOut(fb.auth); signIn(true); };
}
let fb=null;
async function loadFb(){
  if(fb) return fb;
  const get=async n=>{ let last; for(let k=0;k<3;k++){ try{ return await import(G+n+(k?"?r="+k:"")); }catch(e){ last=e; await new Promise(r=>setTimeout(r,800*(k+1))); } } const er=new Error("load"); er.code="t5/load"; er.cause=last; throw er; };
  const [A,U,F]=await Promise.all([get("firebase-app.js"),get("firebase-auth.js"),get("firebase-firestore.js")]);
  const app=A.initializeApp(CFG); const auth=U.getAuth(app); auth.languageCode="vi";
  fb={auth,db:F.getFirestore(app),U,F,signOut:U.signOut}; return fb;
}
async function signIn(pick){
  const err=document.getElementById("err"); const b=document.getElementById("gg")||document.getElementById("sw"); if(b) b.disabled=true;
  try{ const {auth,U}=await loadFb(); const p=new U.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    try{ await U.signInWithPopup(auth,p); }
    catch(e){ if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){ await U.signInWithRedirect(auth,p); return; } throw e; }
    await check();
  }catch(e){ if(b) b.disabled=false; const m=errMsg(e);
    if(err) err.textContent=m; else loginView(m); }
}
async function check(){
  const {auth,db,F}=await loadFb(); const u=auth.currentUser; if(!u){ loginView(); return; }
  const email=(u.email||"").toLowerCase();
  box().innerHTML='<div class="wait">Đang kiểm tra tài khoản…</div>';
  let info=null, code=null;
  try{ const s=await F.getDoc(F.doc(db,"t500_students",email)); info=s.exists()?s.data():null; }catch(e){ info=null; }
  if(!info){ deniedView(email,"Gmail này chưa có trong danh sách học viên của khóa."); return; }
  if(info.locked){ deniedView(email,"Tài khoản của em đang tạm khóa."); return; }
  if(info.until&&info.until.toMillis&&info.until.toMillis()<Date.now()){ deniedView(email,"Tài khoản của em đã hết hạn sử dụng."); return; }
  try{ const s=await F.getDoc(F.doc(db,"t500_secret","key")); code=s.exists()?s.data().code:null; }catch(e){ code=null; }
  if(!code){ deniedView(email,"Tài khoản chưa được kích hoạt hoặc đã bị khóa."); return; }
  const raw=await derive(code); const key=await imp(raw);
  if(await dec(key,CHECK)!=="t500-ok"){ deniedView(email,"Tài liệu đang được cô cập nhật. Em thử lại sau ít phút."); return; }
  const name=info.name||u.displayName||email;
  st.set("t500g",JSON.stringify({k:btoa(String.fromCharCode(...raw)),n:name,e:email,t:Date.now()}));
  ls.set("t500:name",name);
  await open(key,name,email);
}
(async()=>{
  if(/[?&]dangxuat=1/.test(location.search)){ st.del("t500g"); try{ const {auth,signOut}=await loadFb(); await signOut(auth);}catch(e){} history.replaceState(null,"",location.pathname); loginView("Em đã đăng xuất."); return; }
  try{ const c=JSON.parse(st.get("t500g")||"null");
    if(c&&Date.now()-c.t<RECHECK){ const key=await imp(b64(c.k)); if(await dec(key,CHECK)==="t500-ok"){ await open(key,c.n,c.e); return; } }
  }catch(e){}
  st.del("t500g");
  try{ const {auth,U}=await loadFb(); try{ await U.getRedirectResult(auth); }catch(e){}
    await auth.authStateReady(); if(auth.currentUser) await check(); else loginView();
  }catch(e){ loginView(errMsg(e)+' <a href="" onclick="location.reload();return false" style="font-weight:700">↻ Tải lại trang</a>'); }
})();
})();
