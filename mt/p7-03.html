<style>
:root{--bg:#FFF7FA;--card:#fff;--ink:#36141F;--muted:#85596B;--line:#F1CEDB;--accent:#C41F63;--deep:#8E1446;--bad:#B4232C}
@media (prefers-color-scheme:dark){:root{--bg:#1A0F14;--card:#24151C;--ink:#F8E8EF;--muted:#C7A1B2;--line:#45283A;--accent:#FF77A9;--deep:#FFB3CF;--bad:#FF8A8A}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15.5px/1.55 "DM Sans","Segoe UI",system-ui,sans-serif;padding:18px}
.box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:0 8px 30px rgba(120,20,60,.10)}
.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--deep),var(--accent));color:#fff;display:grid;place-items:center;font:700 14px Georgia,serif}

.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:11px;background:#fff;color:#36141F;cursor:pointer}
.gbtn:disabled{opacity:.6}.gbtn svg{width:20px;height:20px}
.pbtn{width:100%;font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px;background:var(--accent);color:#fff;cursor:pointer;margin-top:10px;text-decoration:none;display:block;text-align:center}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin:10px 0 0}
.who{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.9rem;margin-bottom:12px;word-break:break-all}
.alt{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:.88rem}.alt a{color:var(--accent)}
.wait{text-align:center;color:var(--muted)}
</style></head><body>

const esc=s=>String(s||"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const st={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
const ls={set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
async function dec(key,pack){ const [iv,ct]=pack.split("."); const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(iv)},key,b64(ct)); return new TextDecoder().decode(buf); }
async function derive(pass){ const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,256)); }
const imp=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
async function open(key,name,email){
  if(document.readyState!=="complete") await new Promise(r=>window.addEventListener("load",r,{once:true}));
  const html=await dec(key,document.getElementById("t5-data").textContent.trim());
  const badge=`<div aria-hidden="true" style="position:fixed;left:8px;bottom:6px;z-index:99999;pointer-events:none;max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:10px/1.3 system-ui,sans-serif;color:#85596B;background:rgba(255,247,250,.8);border:1px solid #F1CEDB;border-radius:999px;padding:2px 8px;opacity:.75">© Ms. Ngọc Huyền · cấp cho ${esc(name)} · ${esc(email)}</div><div style="text-align:center;font:12px/1.5 system-ui,sans-serif;color:#85596B;padding:14px 10px 30px"><a href="../index.html" style="position:fixed;right:10px;bottom:8px;z-index:99999;font:700 12px/1 system-ui,sans-serif;color:#fff;background:#C41F63;border-radius:999px;padding:9px 14px;text-decoration:none;box-shadow:0 4px 14px rgba(196,31,99,.35)">← Lộ trình</a><a href="../index.html" style="color:#C41F63;font-weight:700">← Về lộ trình</a> · Tài khoản: <b>${esc(email)}</b> · <a href="?dangxuat=1" style="color:#C41F63">Đăng xuất</a></div>`;
  document.open(); document.write(html.replace(/<\/body>/i,badge+"</body>")); document.close();
}
const G_ICON='<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.5z"/></svg>';
const box=()=>document.getElementById("box");
const UA=navigator.userAgent||"";
const INAPP=/Zalo|FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Line\/|musical_ly|Bytedance|TikTok|; wv\)/i.test(UA);
const APPNAME=/Zalo/i.test(UA)?"Zalo":/Messenger/i.test(UA)?"Messenger":/FBAN|FBAV|FB_IAB|FBIOS/i.test(UA)?"Facebook":/Instagram/i.test(UA)?"Instagram":/musical_ly|Bytedance|TikTok/i.test(UA)?"TikTok":"ứng dụng này";
const IOS=/iPhone|iPad|iPod/i.test(UA);
function inappHTML(){ if(!INAPP) return "";
  return `<div style="background:#FFF0D9;border:1px solid #F5D9A8;color:#7a4a00;border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:.9rem;line-height:1.5">
  <b style="display:block;font-size:.98rem;margin-bottom:4px">⚠️ Em đang mở trong ${APPNAME}</b>Google thường <b>chặn đăng nhập</b> trong ${APPNAME}. Em mở link bằng <b>${IOS?"Safari":"Chrome"}</b> nhé:
  <ol style="margin:6px 0 8px;padding-left:1.2em"><li>Bấm nút <b>⋯</b> hoặc <b>⋮</b> ở góc trên bên phải</li><li>Chọn <b>“Mở bằng trình duyệt”</b> / <b>“Open in ${IOS?"Safari":"browser"}”</b></li></ol>
  Không thấy nút đó? Bấm <b>Sao chép link</b> rồi dán vào ${IOS?"Safari":"Chrome"}.
  <button type="button" id="cpl" style="display:block;width:100%;margin-top:8px;font:inherit;font-weight:700;border:0;border-radius:999px;padding:9px;background:#B86B00;color:#fff;cursor:pointer">📋 Sao chép link</button></div>`; }
function wireCopy(){ const c=document.getElementById("cpl"); if(!c) return; c.onclick=async()=>{ const u=location.href.split("#")[0].replace(/[?&]dangxuat=1/,"");
  try{ await navigator.clipboard.writeText(u); c.textContent="✔ Đã sao chép – dán vào trình duyệt nhé"; }
  catch(e){ const t=document.createElement("textarea"); t.value=u; document.body.appendChild(t); t.select(); try{document.execCommand("copy"); c.textContent="✔ Đã sao chép – dán vào trình duyệt nhé";}catch(_){ c.textContent=u; } t.remove(); } }; }
function errMsg(e){ const c=e&&e.code||"";
  if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") return "Em đã đóng cửa sổ đăng nhập. Bấm lại nhé.";
  if(c==="t5/load"||c==="auth/network-request-failed"||/fetch|network|Failed to load|import/i.test(String(e&&e.message||e))) return "Mạng đang chập chờn hoặc chặn máy chủ Google. Em tải lại trang; nếu vẫn lỗi thì tắt trình chặn quảng cáo, đổi sang 4G hoặc thử trình duyệt khác.";
  if(c==="auth/web-storage-unsupported"||c==="auth/operation-not-supported-in-this-environment"||INAPP) return "Trình duyệt này không cho đăng nhập Google. Em mở link bằng Chrome hoặc Safari theo hướng dẫn ở trên nhé.";
  if(c==="auth/too-many-requests") return "Em thử quá nhiều lần. Đợi vài phút rồi thử lại nhé.";
  return "Chưa đăng nhập được (mã lỗi: "+esc(c||"không rõ")+"). Em tải lại trang thử lại, hoặc chụp màn hình gửi cô qua Zalo.";
}
function loginView(msg){
  box().innerHTML=`<div class="mark">500+</div><h1>Lớp TOEIC Online 500+</h1><p>Tài liệu dành riêng cho học viên. Đăng nhập bằng <b>đúng Gmail em đã đăng ký</b> với cô.</p>${inappHTML()}
  <button class="gbtn" id="gg">${G_ICON}<span>Đăng nhập bằng Google</span></button><div class="err" id="err">${msg||""}</div>
  <div class="alt"><a href="../gioi-thieu.html">Chưa đăng ký? Xem khoá học</a><a href="https://zalo.me/0779693605" target="_blank" rel="noopener">Zalo cô Huyền</a></div>`;
  document.getElementById("gg").onclick=signIn; wireCopy();
}
function deniedView(email,reason){
  box().innerHTML=`<div class="mark">500+</div><h1>Chưa mở được tài liệu</h1>
  <div class="who">Em đang đăng nhập: <b>${esc(email)}</b></div>
  <p>${reason}</p><p>Nhắn Zalo cho cô (<b>${ZALO}</b>) kèm Gmail ở trên để được kích hoạt. Nếu em đăng ký bằng Gmail khác, bấm nút dưới để đổi tài khoản.</p>
  <button class="gbtn" id="sw">${G_ICON}<span>Đăng nhập bằng Gmail khác</span></button>
  <div class="alt"><a href="../gioi-thieu.html">Xem khoá học</a><a href="https://zalo.me/0779693605" target="_blank" rel="noopener">Zalo cô Huyền</a></div>`;
  document.getElementById("sw").onclick=async()=>{ await fb.signOut(fb.auth); signIn(true); };
}
let fb=null;
async function loadFb(){
  if(fb) return fb;
  const get=async n=>{ let last; for(let k=0;k<3;k++){ try{ return await import(G+n+(k?"?r="+k:"")); }catch(e){ last=e; await new Promise(r=>setTimeout(r,800*(k+1))); } } const er=new Error("load"); er.code="t5/load"; er.cause=last; throw er; };
  const [A,U,F]=await Promise.all([get("firebase-app.js"),get("firebase-auth.js"),get("firebase-firestore.js")]);
  const app=A.initializeApp(CFG); const auth=U.getAuth(app); auth.languageCode="vi";
  fb={auth,db:F.getFirestore(app),U,F,signOut:U.signOut}; return fb;
}
async function signIn(pick){
  const err=document.getElementById("err"); const b=document.getElementById("gg")||document.getElementById("sw"); if(b) b.disabled=true;
  try{ const {auth,U}=await loadFb(); const p=new U.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    try{ await U.signInWithPopup(auth,p); }
    catch(e){ if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){ await U.signInWithRedirect(auth,p); return; } throw e; }
    await check();
  }catch(e){ if(b) b.disabled=false; const m=errMsg(e);
    if(err) err.textContent=m; else loginView(m); }
}
async function check(){
  const {auth,db,F}=await loadFb(); const u=auth.currentUser; if(!u){ loginView(); return; }
  const email=(u.email||"").toLowerCase();
  box().innerHTML='<div class="wait">Đang kiểm tra tài khoản…</div>';
  let info=null, code=null;
  try{ const s=await F.getDoc(F.doc(db,"t500_students",email)); info=s.exists()?s.data():null; }catch(e){ info=null; }
  if(!info){ deniedView(email,"Gmail này chưa có trong danh sách học viên của khóa."); return; }
  if(info.locked){ deniedView(email,"Tài khoản của em đang tạm khóa."); return; }
  if(info.until&&info.until.toMillis&&info.until.toMillis()<Date.now()){ deniedView(email,"Tài khoản của em đã hết hạn sử dụng."); return; }
  try{ const s=await F.getDoc(F.doc(db,"t500_secret","key")); code=s.exists()?s.data().code:null; }catch(e){ code=null; }
  if(!code){ deniedView(email,"Tài khoản chưa được kích hoạt hoặc đã bị khóa."); return; }
  const raw=await derive(code); const key=await imp(raw);
  if(await dec(key,CHECK)!=="t500-ok"){ deniedView(email,"Tài liệu đang được cô cập nhật. Em thử lại sau ít phút."); return; }
  const name=info.name||u.displayName||email;
  st.set("t500g",JSON.stringify({k:btoa(String.fromCharCode(...raw)),n:name,e:email,t:Date.now()}));
  ls.set("t500:name",name);
  await open(key,name,email);
}
(async()=>{
  if(/[?&]dangxuat=1/.test(location.search)){ st.del("t500g"); try{ const {auth,signOut}=await loadFb(); await signOut(auth);}catch(e){} history.replaceState(null,"",location.pathname); loginView("Em đã đăng xuất."); return; }
  try{ const c=JSON.parse(st.get("t500g")||"null");
    if(c&&Date.now()-c.t<RECHECK){ const key=await imp(b64(c.k)); if(await dec(key,CHECK)==="t500-ok"){ await open(key,c.n,c.e); return; } }
  }catch(e){}
  st.del("t500g");
  try{ const {auth,U}=await loadFb(); try{ await U.getRedirectResult(auth); }catch(e){}
    await auth.authStateReady(); if(auth.currentUser) await check(); else loginView();
  }catch(e){ loginView(errMsg(e)+' <a href="" onclick="location.reload();return false" style="font-weight:700">↻ Tải lại trang</a>'); }
})();
})();
