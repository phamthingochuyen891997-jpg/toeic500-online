<style>
:root{--bg:#FFF7FA;--card:#fff;--ink:#36141F;--muted:#85596B;--line:#F1CEDB;--accent:#C41F63;--deep:#8E1446;--bad:#B4232C}
@media (prefers-color-scheme:dark){:root{--bg:#1A0F14;--card:#24151C;--ink:#F8E8EF;--muted:#C7A1B2;--line:#45283A;--accent:#FF77A9;--deep:#FFB3CF;--bad:#FF8A8A}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15.5px/1.55 "DM Sans","Segoe UI",system-ui,sans-serif;padding:18px}
.box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:0 8px 30px rgba(120,20,60,.10)}
.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--deep),var(--accent));color:#fff;display:grid;place-items:center;font:700 14px Georgia,serif}
h1{font:700 1.45rem Georgia,"Times New Roman",serif;margin:14px 0 4px}p{margin:0 0 14px;color:var(--muted);font-size:.93rem}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:11px;background:#fff;color:#36141F;cursor:pointer}
.gbtn:disabled{opacity:.6}.gbtn svg{width:20px;height:20px}
.pbtn{width:100%;font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px;background:var(--accent);color:#fff;cursor:pointer;margin-top:10px;text-decoration:none;display:block;text-align:center}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin:10px 0 0}
.who{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.9rem;margin-bottom:12px;word-break:break-all}
.alt{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:.88rem}.alt a{color:var(--accent)}
.wait{text-align:center;color:var(--muted)}
</style></head><body>

function errMsg(e){ const c=e&&e.code||"";

let fb=null;
async function loadFb(){
  if(fb) return fb;

  const [A,U,F]=await Promise.all([get("firebase-app.js"),get("firebase-auth.js"),get("firebase-firestore.js")]);
  const app=A.initializeApp(CFG); const auth=U.getAuth(app); auth.languageCode="vi";
  fb={auth,db:F.getFirestore(app),U,F,signOut:U.signOut}; return fb;
}
async function signIn(pick){

async function check(){
  const {auth,db,F}=await loadFb(); const u=auth.currentUser; if(!u){ loginView(); return; }

  if(info.locked){ deniedView(email,"Tài khoản của em đang tạm khóa."); return; }
  if(info.until&&info.until.toMillis&&info.until.toMillis()<Date.now()){ deniedView(email,"Tài khoản của em đã hết hạn sử dụng."); return; }

}
