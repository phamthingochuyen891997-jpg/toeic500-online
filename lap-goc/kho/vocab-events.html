<style>
:root{--bg:#FFF7F0;--card:#FFFFFF;--ink:#22403D;--muted:#6E8580;--line:#D9E6DF;--accent:#C25B6E;--deep:#2F5D5A;--bad:#B4232C}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15.5px/1.55 "DM Sans","Segoe UI",system-ui,sans-serif;padding:18px}
.box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:0 8px 30px rgba(47,93,90,.12)}
.mark{width:52px;height:52px;border-radius:14px;overflow:hidden;background:none;color:#fff;display:grid;place-items:center;font:700 22px system-ui}
h1{font:700 1.45rem Georgia,"Times New Roman",serif;margin:14px 0 4px}p{margin:0 0 14px;color:var(--muted);font-size:.93rem}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:11px;background:#fff;color:#22403D;cursor:pointer}
.gbtn:disabled{opacity:.6}.gbtn svg{width:20px;height:20px}
.pbtn{width:100%;font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px;background:var(--accent);color:#fff;cursor:pointer;margin-top:10px;text-decoration:none;display:block;text-align:center}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin:10px 0 0}
.who{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.9rem;margin-bottom:12px;word-break:break-all}
.alt{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:.88rem}.alt a{color:var(--accent)}
.wait{text-align:center;color:var(--muted)}
.lockup{display:flex;align-items:center;gap:14px;margin:0 0 16px}.lockup svg{flex:none}
.lw{font:800 34px/1 "Be Vietnam Pro",system-ui,sans-serif;letter-spacing:-.015em;color:#1E3F3C}.lw span{color:#E8566F}
.ls{display:flex;align-items:center;gap:8px;margin-top:6px;font:700 11px/1 "Be Vietnam Pro",system-ui,sans-serif;letter-spacing:.32em;color:#1E5C58}.ls i{width:16px;height:2px;background:#EDA737;display:inline-block}.ls em{font-style:normal;color:#E39B1C;letter-spacing:.1em}

const APPNAME=/Zalo/i.test(UA)?"Zalo":/Messenger/i.test(UA)?"Messenger":/FBAN|FBAV|FB_IAB|FBIOS/i.test(UA)?"Facebook":/Instagram/i.test(UA)?"Instagram":/musical_ly|Bytedance|TikTok/i.test(UA)?"TikTok":"ứng dụng này";
const IOS=/iPhone|iPad|iPod/i.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const WEBVIEW=INAPP||(IOS&&!/Safari\//.test(UA));
function inappHTML(force){ if(!WEBVIEW&&!force) return "";
  return `<div style="background:#FFF0D9;border:1px solid #F5D9A8;color:#7a4a00;border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:.9rem;line-height:1.5">
  <b style="display:block;font-size:.98rem;margin-bottom:4px">⚠️ ${WEBVIEW?"Em đang mở trong "+APPNAME:"Trình duyệt chặn đăng nhập"}</b>Google thường <b>chặn đăng nhập</b> khi mở link trong Zalo/Messenger. Em mở link bằng <b>${IOS?"Safari":"Chrome"}</b> nhé:
  <ol style="margin:6px 0 8px;padding-left:1.2em"><li>Bấm nút <b>⋯</b> hoặc <b>⋮</b> ở góc trên bên phải</li><li>Chọn <b>“Mở bằng trình duyệt”</b> / <b>“Open in ${IOS?"Safari":"browser"}”</b></li></ol>
  Không thấy nút đó? Bấm <b>Sao chép link</b> rồi dán vào ${IOS?"Safari":"Chrome"}.
  ${!IOS?`<a href="intent://${location.host}${location.pathname}#Intent;scheme=https;package=com.android.chrome;end" style="display:block;text-align:center;margin-top:8px;font-weight:700;border-radius:999px;padding:9px;background:#1a73e8;color:#fff;text-decoration:none">🌐 Mở bằng Chrome</a>`:""}
  <button type="button" id="cpl" style="display:block;width:100%;margin-top:8px;font:inherit;font-weight:700;border:0;border-radius:999px;padding:9px;background:#B86B00;color:#fff;cursor:pointer">📋 Sao chép link</button></div>`; }
function wireCopy(){ const c=document.getElementById("cpl"); if(!c) return; c.onclick=async()=>{ const u=location.href.split("#")[0].replace(/[?&]dangxuat=1/,"");
  try{ await navigator.clipboard.writeText(u); c.textContent="✔ Đã sao chép – dán vào trình duyệt nhé"; }
  catch(e){ const t=document.createElement("textarea"); t.value=u; document.body.appendChild(t); t.select(); try{document.execCommand("copy"); c.textContent="✔ Đã sao chép – dán vào trình duyệt nhé";}catch(_){ c.textContent=u; } t.remove(); } }; }
function errMsg(e){ const c=e&&e.code||"";
  if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") return "Em đã đóng cửa sổ đăng nhập. Bấm lại nhé.";
  if(c==="t5/load"||c==="auth/network-request-failed"||/fetch|network|Failed to load|import/i.test(String(e&&e.message||e))) return "Mạng đang chập chờn hoặc chặn máy chủ Google. Em tải lại trang; nếu vẫn lỗi thì tắt trình chặn quảng cáo, đổi sang 4G hoặc thử trình duyệt khác.";
  if(c==="auth/web-storage-unsupported"||c==="auth/operation-not-supported-in-this-environment"||INAPP) return "Trình duyệt này không cho đăng nhập Google. Em mở link bằng Chrome hoặc Safari theo hướng dẫn ở trên nhé.";
  if(c==="auth/too-many-requests") return "Em thử quá nhiều lần. Đợi vài phút rồi thử lại nhé.";
  return "Chưa đăng nhập được (mã lỗi: "+esc(c||"không rõ")+"). Em tải lại trang thử lại, hoặc chụp màn hình gửi cô qua Zalo.";
}
function loginView(msg,force){
  box().innerHTML=`<div class="lockup"><svg viewBox="0 0 100 100" width="76" height="76" aria-hidden="true"><g transform="translate(50 57)"><path transform="rotate(-62)" d="M0 0 C-11 -11.4 -6.82 -25.8 0 -30 C6.82 -25.8 11 -11.4 0 0Z" fill="#E8566F"/><path transform="rotate(62)" d="M0 0 C-11 -11.4 -6.82 -25.8 0 -30 C6.82 -25.8 11 -11.4 0 0Z" fill="#E8566F"/><path transform="rotate(-30)" d="M0 0 C-12.5 -13.68 -7.75 -30.96 0 -36 C7.75 -30.96 12.5 -13.68 0 0Z" fill="#F4808F"/><path transform="rotate(30)" d="M0 0 C-12.5 -13.68 -7.75 -30.96 0 -36 C7.75 -30.96 12.5 -13.68 0 0Z" fill="#F4808F"/><path transform="rotate(0)" d="M0 0 C-14 -15.96 -8.68 -36.12 0 -42 C8.68 -36.12 14 -15.96 0 0Z" fill="#FBB6C0"/></g><path d="M19 61 H81" stroke="#3FA48B" stroke-width="4.2" stroke-linecap="round"/><g fill="none" stroke="#EDA737" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"><path d="M50 67 V92"/><path d="M50 67 C50 79 35 78 33 92"/><path d="M50 67 C50 79 65 78 67 92"/></g></svg><div><div class="lw">Lấp <span>Gốc</span></div><div class="ls">TOEIC<i></i><em>500+</em></div></div></div><p>Lộ trình tự học 500+ dành riêng cho học viên của cô Ngọc Huyền. Đăng nhập bằng <b>đúng Gmail em đã đăng ký</b> với cô.</p>${inappHTML(force)}
  <button class="gbtn" id="gg">${G_ICON}<span>Đăng nhập bằng Google</span></button><div class="err" id="err">${msg||""}</div>
  <div class="alt"><span></span><a href="https://zalo.me/0779693605" target="_blank" rel="noopener">Zalo cô Huyền</a></div>`;
  document.getElementById("gg").onclick=signIn; wireCopy();
}
function deniedView(email,reason){
  box().innerHTML=`<div class="mark"><img src="/toeic500-online/lap-goc/icons/icon-192.png" alt="" width="52" height="52"></div><h1>Chưa mở được lộ trình</h1>
  <div class="who">Em đang đăng nhập: <b>${esc(email)}</b></div>
  <p>${reason}</p><p>Nhắn Zalo cho cô (<b>${ZALO}</b>) kèm Gmail ở trên để được kích hoạt. Nếu em đăng ký bằng Gmail khác, bấm nút dưới để đổi tài khoản.</p>
  <button class="gbtn" id="sw">${G_ICON}<span>Đăng nhập bằng Gmail khác</span></button>
  <div class="alt"><span></span><a href="https://zalo.me/0779693605" target="_blank" rel="noopener">Zalo cô Huyền</a></div>`;
  document.getElementById("sw").onclick=async()=>{ await fb.signOut(fb.auth); signIn(true); };
}
let fb=null;
async function loadFb(){
  if(fb) return fb;
  const get=async n=>{ let last; for(let k=0;k<3;k++){ try{ return await import(G+n+(k?"?r="+k:"")); }catch(e){ last=e; await new Promise(r=>setTimeout(r,800*(k+1))); } } const er=new Error("load"); er.code="t5/load"; er.cause=last; throw er; };
  const [A,U,F]=await Promise.all([get("firebase-app.js"),get("firebase-auth.js"),get("firebase-firestore.js")]);
  const app=A.initializeApp(CFG); const auth=U.getAuth(app); auth.languageCode="vi";
  fb={auth,db:F.getFirestore(app),U,F,signOut:U.signOut}; return fb;
}
async function signIn(pick){
  const err=document.getElementById("err"); const b=document.getElementById("gg")||document.getElementById("sw"); if(b) b.disabled=true;
  if(WEBVIEW&&document.getElementById("gg")){ loginView("Em mở link bằng "+(IOS?"Safari":"Chrome")+" theo hướng dẫn ở trên rồi đăng nhập nhé.",true); return; }
  try{ const {auth,U}=await loadFb(); const p=new U.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
    try{ await U.signInWithPopup(auth,p); }
    catch(e){ if(e&&e.code==="auth/popup-blocked"){ if(b) b.disabled=false; loginView("Trình duyệt chặn cửa sổ đăng nhập. Em bấm lại nút Đăng nhập; nếu vẫn không được, mở link bằng "+(IOS?"Safari":"Chrome")+".",true); return; } if(e&&e.code==="auth/operation-not-supported-in-this-environment"){ loginView(errMsg(e),true); return; } throw e; }
    await check();
  }catch(e){ if(b) b.disabled=false; const m=errMsg(e);
    if(err) err.textContent=m; else loginView(m); }
}
async function check(){
  const {auth,db,F}=await loadFb(); const u=auth.currentUser; if(!u){ loginView(); return; }
  const email=(u.email||"").toLowerCase();
  box().innerHTML='<div class="wait">Đang kiểm tra tài khoản…</div>';
  let info=null, code=null;
  try{ const s=await F.getDoc(F.doc(db,"lg_students",email)); info=s.exists()?s.data():null; }catch(e){ info=null; }
  let isT=false; try{ const p=await F.getDoc(F.doc(db,"users",u.uid)); isT=p.exists()&&p.data().role==="teacher"; }catch(e){}
  if(isT&&!info) info={name:u.displayName||"Cô Huyền"};
  if(!info){ /* Tự đăng ký: Gmail nào cũng vào học được, tiến độ tự lưu */
    try{ const d={name:u.displayName||"",email,self:true,createdAt:F.serverTimestamp()}; await F.setDoc(F.doc(db,"lg_students",email),d); info=d; }
    catch(e){ deniedView(email,"Chưa đăng ký được tài khoản. Em thử lại sau ít phút hoặc nhắn Zalo cô Huyền."); return; } }
  if(info.locked){ deniedView(email,"Tài khoản của em đang tạm khóa."); return; }
  if(info.until&&info.until.toMillis&&info.until.toMillis()<Date.now()){ deniedView(email,"Tài khoản của em đã hết hạn sử dụng."); return; }
  try{ const s=await F.getDoc(F.doc(db,"lg_secret","key")); code=s.exists()?s.data().code:null; }catch(e){ code=null; }
  if(!code){ deniedView(email,"Tài khoản chưa được kích hoạt hoặc đã bị khóa."); return; }
  const raw=await derive(code); const key=await imp(raw);
  if(await dec(key,CHECK)!=="lg-ok"){ deniedView(email,"Tài liệu đang được cô cập nhật. Em thử lại sau ít phút."); return; }
  const name=info.name||u.displayName||email;
  st.set("lgg",JSON.stringify({k:btoa(String.fromCharCode(...raw)),n:name,e:email,s:info.self===true,t:Date.now()}));
  ls.set("lg:name",name);
  await open(key,name,email,info.self===true);
}
(async()=>{
  if(/[?&]dangxuat=1/.test(location.search)){ st.del("lgg"); try{ const {auth,signOut}=await loadFb(); await signOut(auth);}catch(e){} history.replaceState(null,"",location.pathname); loginView("Em đã đăng xuất."); return; }
  try{ const c=JSON.parse(st.get("lgg")||"null");
    if(c&&Date.now()-c.t<RECHECK){ const key=await imp(b64(c.k)); if(await dec(key,CHECK)==="lg-ok"){ await open(key,c.n,c.e,c.s===true); return; } }
  }catch(e){}
  st.del("lgg");
  try{ const {auth,U}=await loadFb(); let rerr=null; try{ await U.getRedirectResult(auth); }catch(e){ rerr=e; }
    if(rerr){ loginView("Lần đăng nhập trước bị trình duyệt chặn. Em mở link bằng "+(IOS?"Safari":"Chrome")+" rồi bấm Đăng nhập lại nhé.",true); return; }
    await auth.authStateReady(); if(auth.currentUser) await check(); else loginView();
  }catch(e){ loginView(errMsg(e)+' <a href="" onclick="location.reload();return false" style="font-weight:700">↻ Tải lại trang</a>'); }
})();
})();
</script>
